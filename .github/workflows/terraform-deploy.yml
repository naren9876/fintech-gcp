name: Terraform

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform-deploy.yml"]

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: 1.9.0

jobs:
  # =================================================================
  # PRs: plan ALL THREE environments, one comment each. The reviewer
  # sees the full blast radius before anything merges.
  # =================================================================
  plan-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: dev
            suffix: DEV
          - env: staging
            suffix: STG
          - env: prod
            suffix: PRD
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('GCP_WIF_PROVIDER_{0}', matrix.suffix)] }}
          service_account: ${{ vars[format('GCP_CI_SA_{0}', matrix.suffix)] }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: init (${{ matrix.env }})
        working-directory: terraform
        run: terraform init -backend-config=environments/${{ matrix.env }}.gcsbackend

      - name: validate
        working-directory: terraform
        run: terraform validate

      - name: plan (${{ matrix.env }})
        working-directory: terraform
        run: |
          terraform plan -var-file=environments/${{ matrix.env }}.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 55000) plan = plan.slice(0, 55000) + '\n... (truncated)';
            const body = `### Terraform plan — ${{ matrix.env }}\n\`\`\`\n${plan}\n\`\`\`\n**Zero destroys is the number to check first.**`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

  # =================================================================
  # Merge to main: DEV applies automatically (the sandbox proves it)
  # =================================================================
  apply-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          service_account: ${{ vars.GCP_CI_SA_DEV }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        working-directory: terraform
        run: terraform init -backend-config=environments/dev.gcsbackend
      - name: plan
        working-directory: terraform
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan
      - name: apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # =================================================================
  # STAGING promotion: plan first (ungated - approver READS this),
  # then the gated apply executes the saved plan.
  # =================================================================
  plan-staging:
    needs: apply-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_STG }}
          service_account: ${{ vars.GCP_CI_SA_STG }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        working-directory: terraform
        run: terraform init -backend-config=environments/staging.gcsbackend
      - name: plan
        working-directory: terraform
        run: |
          terraform plan -var-file=environments/staging.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          echo '## Staging plan (approve the next job AFTER reading this)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -c 60000 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging
          path: terraform/tfplan
          retention-days: 1

  apply-staging:
    needs: plan-staging
    runs-on: ubuntu-latest
    environment: staging   # <- Required Reviewers gate lives here
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_STG }}
          service_account: ${{ vars.GCP_CI_SA_STG }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        working-directory: terraform
        run: terraform init -backend-config=environments/staging.gcsbackend
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: terraform
      - name: apply (the saved, reviewed plan)
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # =================================================================
  # PROD promotion: same two-step, gated by 'production'
  # =================================================================
  plan-prod:
    needs: apply-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PRD }}
          service_account: ${{ vars.GCP_CI_SA_PRD }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        working-directory: terraform
        run: terraform init -backend-config=environments/prod.gcsbackend
      - name: plan
        working-directory: terraform
        run: |
          terraform plan -var-file=environments/prod.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          echo '## PROD plan (approve the next job AFTER reading this)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -c 60000 plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/tfplan
          retention-days: 1

  apply-prod:
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: production   # <- Required Reviewers gate
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PRD }}
          service_account: ${{ vars.GCP_CI_SA_PRD }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: init
        working-directory: terraform
        run: terraform init -backend-config=environments/prod.gcsbackend
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: terraform
      - name: apply (the saved, reviewed plan)
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
